[project]
name = "eido"
version = "0.3.0"
description = "A project metadata validator"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Michal Stolarczyk" },
    { name = "Nathan Sheffield" },
]
keywords = ["project", "metadata", "bioinformatics", "sequencing", "ngs", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "jsonschema>=3.0.1",
    "logmuse>=0.2.5",
    "pandas",
    "peppy>=0.40.7",
    "ubiquerg>=0.5.2",
]

[project.optional-dependencies]
test = [
    "pytest>=4.6.9",
    "pytest-cov>=2.8.1",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/pepkit/eido/"

[project.scripts]
eido = "eido.__main__:main"

[project.entry-points."pep.filters"]
basic = "eido.conversion_plugins:basic_pep_filter"
yaml = "eido.conversion_plugins:yaml_pep_filter"
csv = "eido.conversion_plugins:csv_pep_filter"
yaml-samples = "eido.conversion_plugins:yaml_samples_pep_filter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-rfE"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
# webeido is a separate, un-modernized subproject
extend-exclude = ["webeido"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F403", "F405", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["eido"]
